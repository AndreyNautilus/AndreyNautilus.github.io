<div class="shell-abbreviation">
    <pre><code><span>$ <span data-shell-abbreviation="{{ .Get 0 }}">{{ .Get 1 }}</span><span aria-hidden="true" hidden>▏</span></span></code></pre>
    <button type="button" aria-label="Replay terminal animation" title="Replay" hidden>
        <span class="shell-replay-progress" aria-hidden="true"></span>
        <svg class="shell-replay-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <polygon points="5,3 17,9 5,15" fill="currentColor" />
        </svg>
    </button>
</div>
{{- with resources.Get "js/shell-abbreviation.js" | resources.Minify | resources.Fingerprint }}
<script type="module" src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>
{{- end }}
